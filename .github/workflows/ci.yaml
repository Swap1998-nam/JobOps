name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: jobops, POSTGRES_PASSWORD: jobops, POSTGRES_DB: jobops}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobops" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: bandit -r app -q
      - run: pip-audit -r requirements.txt
      - run: docker build -t jobops:${{ github.sha }} .

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobops
spec:
  replicas: 2
  selector:
    matchLabels: {app: jobops}
  template:
    metadata:
      labels: {app: jobops}
      annotations: {prometheus.io/scrape: 'true', prometheus.io/port: '8000', prometheus.io/path: /metrics}
    spec:
      containers:
        - name: app
          image: jobops:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: jobops-db, key: database-url}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
---
apiVersion: v1
kind: Service
metadata: {name: jobops}
spec:
  selector: {app: jobops}
  ports: [{port: 80, targetPort: 8000}]
